services:
  front:
    container_name: front
    build:
      context: .
    restart: on-failure
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/
      - /usr/src/node_modules
      - /usr/src/.next
    depends_on:
      - service

  service:
    container_name: msgram-service
    image: measuresoftgram/service:latest
    command: ["./start_service.sh"]
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - ./env-vars/.service.env
      - ./env-vars/.postgres.env
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: msgram-postgres
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - service_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./env-vars/.postgres.env
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  service_postgres_data: