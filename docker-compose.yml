services:
  front:
    container_name: front
    build:
      context: .
      args:
        SERVICE_URL: ${SERVICE_URL:-http://localhost:8080/api}
        LOGIN_REDIRECT_URL: ${LOGIN_REDIRECT_URL:-}
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    restart: on-failure
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/
      - /usr/src/node_modules
      - /usr/src/.next
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
